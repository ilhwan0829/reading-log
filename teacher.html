<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>독서 기록 확인 (교사용)</title>
<style>
  :root {
    --bg: #faf6ef;
    --card: #ffffff;
    --ink: #2f2a22;
    --sub: #7a715f;
    --accent: #3f7d58;
    --accent-dark: #2f5f43;
    --accent-soft: #e4efe6;
    --lv1: #e4efe6;
    --lv2: #b9d8c2;
    --lv3: #7fb592;
    --lv4: #3f7d58;
    --none-bg: #f3efe7;
    --warn: #b85042;
    --warn-soft: #fbe9e6;
    --border: #e7ded0;
    --shadow: 0 4px 16px rgba(63, 125, 88, 0.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 60px; }
  header { text-align: center; margin-bottom: 18px; }
  header h1 { font-size: 21px; margin: 0 0 4px; }
  header p { color: var(--sub); font-size: 13px; margin: 0; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }
  button { font-family: inherit; cursor: pointer; border: none; }
  .btn-primary {
    width: 100%; padding: 13px; font-size: 15px; font-weight: 700;
    color: #fff; background: var(--accent); border-radius: 10px; margin-top: 10px;
  }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:disabled { background: #c8c0b0; cursor: not-allowed; }
  .auth { max-width: 420px; margin: 0 auto; }
  .auth label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 6px; font-weight: 600; }
  .auth input {
    width: 100%; padding: 12px 14px; font-size: 15px;
    border: 1.5px solid var(--border); border-radius: 10px; color: var(--ink);
  }
  .auth input:focus { outline: none; border-color: var(--accent); }
  .msg { font-size: 13px; border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; }
  .msg.error { background: var(--warn-soft); color: var(--warn); }

  /* 날짜 이동 바 */
  .datebar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 14px; flex-wrap: wrap;
  }
  .datebar .nav {
    width: 38px; height: 38px; border-radius: 10px; background: var(--card);
    border: 1px solid var(--border); font-size: 16px; color: var(--ink);
  }
  .datebar .nav:hover { border-color: var(--accent); }
  .datebar .date-label {
    font-size: 19px; font-weight: 800; min-width: 170px; text-align: center;
  }
  .datebar .chip-btn {
    padding: 9px 12px; border-radius: 10px; background: var(--card);
    border: 1px solid var(--border); font-size: 13px; font-weight: 700; color: var(--accent-dark);
  }
  .datebar .chip-btn:hover { border-color: var(--accent); }

  /* 요약 */
  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
  .sum-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 10px; text-align: center; }
  .sum-box .num { font-size: 24px; font-weight: 800; color: var(--accent-dark); font-variant-numeric: tabular-nums; }
  .sum-box .num small { font-size: 14px; color: var(--sub); font-weight: 700; }
  .sum-box .lbl { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .sum-box.alert .num { color: var(--warn); }

  /* 학생 격자 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
    gap: 8px;
  }
  .tile {
    position: relative;
    border-radius: 12px;
    padding: 10px 10px 12px;
    background: var(--none-bg);
    border: 1px solid var(--border);
    text-align: left;
    color: var(--ink);
    min-height: 92px;
  }
  .tile:hover { outline: 2px solid var(--accent); outline-offset: -1px; }
  .tile .no { font-size: 12px; font-weight: 700; color: var(--sub); }
  .tile .nm { font-size: 15px; font-weight: 800; margin-top: 1px; }
  .tile .mins { font-size: 20px; font-weight: 800; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .tile .mins.zero { font-size: 13px; font-weight: 700; color: #a89f8d; margin-top: 12px; }
  .tile .tot { font-size: 10.5px; color: var(--sub); margin-top: 3px; }
  .tile.lv1 { background: var(--lv1); border-color: #cfe3d4; }
  .tile.lv2 { background: var(--lv2); border-color: #a6ccb2; }
  .tile.lv3 { background: var(--lv3); border-color: #6aa680; }
  .tile.lv4 { background: var(--lv4); border-color: var(--accent-dark); color: #fff; }
  .tile.lv3 .no, .tile.lv3 .tot { color: #2a4a36; }
  .tile.lv4 .no, .tile.lv4 .tot { color: #d8eadc; }

  .legend { display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; font-size: 11.5px; color: var(--sub); margin: 10px 2px 0; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; border: 1px solid var(--border); }

  .notread { margin-top: 14px; }
  .notread h3 { font-size: 13.5px; margin: 0 0 8px; color: var(--warn); }
  .notread .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .notread .chips span {
    font-size: 13px; padding: 5px 10px; border-radius: 999px;
    background: var(--warn-soft); color: var(--warn); font-weight: 600;
  }
  .notread .all-done { font-size: 13.5px; color: var(--accent-dark); font-weight: 700; }

  .excluded-note {
    font-size: 12px; color: var(--sub); background: #f5f1e8; border-radius: 10px;
    padding: 9px 12px; margin-top: 12px;
  }

  /* 학생 상세 */
  .overlay {
    position: fixed; inset: 0; background: rgba(47, 42, 34, 0.35);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  .overlay.show { display: flex; }
  .detail {
    background: var(--card); border-radius: 16px; width: 100%; max-width: 420px;
    max-height: 85vh; overflow: auto; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.18);
  }
  .detail-head { display: flex; justify-content: space-between; align-items: flex-start; }
  .detail-head h2 { margin: 0; font-size: 19px; }
  .detail-head .close { background: none; font-size: 22px; color: var(--sub); line-height: 1; padding: 0 4px; }
  .detail .stats { display: flex; gap: 8px; margin: 14px 0 10px; }
  .detail .stats div { flex: 1; background: var(--accent-soft); border-radius: 10px; padding: 10px; text-align: center; }
  .detail .stats b { display: block; font-size: 17px; color: var(--accent-dark); }
  .detail .stats span { font-size: 11px; color: var(--sub); }
  .day-row { display: flex; justify-content: space-between; padding: 8px 2px; font-size: 14px; border-bottom: 1px solid var(--border); }
  .day-row:last-child { border-bottom: none; }
  .day-row .d { color: var(--sub); }
  .day-row .m { font-weight: 700; }
  .day-row.sel { background: #fbf6e9; }
  .empty { text-align: center; color: var(--sub); font-size: 13px; padding: 18px 0; }

  footer { text-align: center; font-size: 11.5px; color: #a89f8d; margin-top: 24px; }

  @media (max-width: 600px) {
    .summary { grid-template-columns: repeat(2, 1fr); }
    .grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .tile { padding: 8px 8px 10px; min-height: 84px; }
    .tile .nm { font-size: 14px; }
    .tile .mins { font-size: 17px; }
    .tile .tot { display: none; }
    .datebar .date-label { min-width: 0; font-size: 17px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 우리 반 독서 현황</h1>
    <p>출석번호 순서로 그날 읽은 시간을 한눈에 확인합니다</p>
  </header>

  <!-- 암호 입력 -->
  <div id="screenAuth" class="card auth">
    <div id="authMsg"></div>
    <label for="inputKey">확인용 암호</label>
    <input type="text" id="inputKey" autocomplete="off" placeholder="암호 입력">
    <button class="btn-primary" id="btnAuth">불러오기</button>
  </div>

  <!-- 현황 화면 -->
  <div id="screenMain" style="display:none;">
    <div class="datebar">
      <button class="nav" id="btnPrev" title="전날">◀</button>
      <div class="date-label" id="dateLabel"></div>
      <button class="nav" id="btnNext" title="다음날">▶</button>
      <button class="chip-btn" id="btnToday">오늘</button>
      <button class="chip-btn" id="btnRefresh">↻ 새로고침</button>
    </div>

    <div class="summary">
      <div class="sum-box"><div class="num" id="sumRead">0<small>/27</small></div><div class="lbl">읽은 학생</div></div>
      <div class="sum-box alert"><div class="num" id="sumNot">0</div><div class="lbl">아직 안 읽은 학생</div></div>
      <div class="sum-box"><div class="num" id="sumTotal">0분</div><div class="lbl">반 전체 독서시간</div></div>
      <div class="sum-box"><div class="num" id="sumAvg">0분</div><div class="lbl">읽은 학생 평균</div></div>
    </div>

    <div class="card" style="padding:14px;">
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span><i style="background:var(--none-bg)"></i>기록 없음</span>
        <span><i style="background:var(--lv1)"></i>1~9분</span>
        <span><i style="background:var(--lv2)"></i>10~19분</span>
        <span><i style="background:var(--lv3)"></i>20~29분</span>
        <span><i style="background:var(--lv4)"></i>30분 이상</span>
      </div>
      <div class="notread" id="notRead"></div>
      <div class="excluded-note" id="excludedNote" style="display:none;"></div>
    </div>
  </div>

  <footer>칸을 누르면 그 학생의 날짜별 기록을 볼 수 있어요</footer>
</div>

<!-- 학생 상세 -->
<div class="overlay" id="overlay">
  <div class="detail" id="detail"></div>
</div>

<script>
// 학생용 앱과 같은 앱스스크립트 웹 앱 주소
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby9WWlcAKP7u-9ZB71e_-SkPBgfzp2N0XF1OunTD9ZhA6ro0_S_l65Yo1F9cYEt-zF2kg/exec';

let students = [];     // [{no, name, totalMinutes, sessionCount, days:[{date, minutes}]}]
let excludedCount = 0;
let teacherKey = '';
let viewDate = todayStr();

const $ = (id) => document.getElementById(id);
const WEEK = ['일', '월', '화', '수', '목', '금', '토'];

function pad(n) { return String(n).padStart(2, '0'); }
function toStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayStr() { return toStr(new Date()); }
function shiftDate(str, delta) {
  const [y, m, d] = str.split('-').map(Number);
  return toStr(new Date(y, m - 1, d + delta));
}
function dateLabel(str) {
  const [y, m, d] = str.split('-').map(Number);
  const w = WEEK[new Date(y, m - 1, d).getDay()];
  return m + '월 ' + d + '일 (' + w + ')' + (str === todayStr() ? ' · 오늘' : '');
}
function fmtMinutes(total) {
  const h = Math.floor(total / 60), m = total % 60;
  return h > 0 ? (h + '시간 ' + m + '분') : (m + '분');
}
function minutesOn(s, date) {
  const f = (s.days || []).find(d => d.date === date);
  return f ? f.minutes : 0;
}
function level(m) {
  if (m <= 0) return '';
  if (m < 10) return 'lv1';
  if (m < 20) return 'lv2';
  if (m < 30) return 'lv3';
  return 'lv4';
}
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function fetchJson(url) {
  const res = await fetch(url);
  const text = await res.text();
  try { return JSON.parse(text); }
  catch (e) {
    const snippet = text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 160);
    throw new Error('JSON이 아닌 응답(HTTP ' + res.status + '): ' + snippet);
  }
}

// ---------- 불러오기 ----------
$('btnAuth').addEventListener('click', login);
$('inputKey').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

async function login() {
  const key = $('inputKey').value.trim();
  if (!key) { $('authMsg').innerHTML = '<div class="msg error">암호를 입력해주세요.</div>'; return; }
  $('authMsg').innerHTML = '';
  $('btnAuth').disabled = true;
  $('btnAuth').textContent = '불러오는 중...';
  try {
    await load(key);
    teacherKey = key;
    $('screenAuth').style.display = 'none';
    $('screenMain').style.display = 'block';
    render();
  } catch (err) {
    $('authMsg').innerHTML = '<div class="msg error">불러오지 못했습니다.<br><span style="font-size:11px;">(' + escapeHtml(err.message) + ')</span></div>';
  } finally {
    $('btnAuth').disabled = false;
    $('btnAuth').textContent = '불러오기';
  }
}

async function load(key) {
  const data = await fetchJson(APPS_SCRIPT_URL + '?mode=teacher&key=' + encodeURIComponent(key));
  if (!data.ok) throw new Error(data.error || '알 수 없는 오류');
  students = data.students || [];
  excludedCount = data.excludedCount || 0;
}

$('btnRefresh').addEventListener('click', async () => {
  $('btnRefresh').textContent = '불러오는 중...';
  try { await load(teacherKey); render(); }
  catch (err) { alert('새로고침 실패: ' + err.message); }
  finally { $('btnRefresh').textContent = '↻ 새로고침'; }
});

$('btnPrev').addEventListener('click', () => { viewDate = shiftDate(viewDate, -1); render(); });
$('btnNext').addEventListener('click', () => { viewDate = shiftDate(viewDate, 1); render(); });
$('btnToday').addEventListener('click', () => { viewDate = todayStr(); render(); });

// ---------- 화면 그리기 ----------
function render() {
  $('dateLabel').textContent = dateLabel(viewDate);
  $('btnNext').disabled = viewDate >= todayStr();
  $('btnNext').style.opacity = viewDate >= todayStr() ? 0.35 : 1;

  const total = students.length;
  const read = students.filter(s => minutesOn(s, viewDate) > 0);
  const sumMin = read.reduce((a, s) => a + minutesOn(s, viewDate), 0);

  $('sumRead').innerHTML = read.length + '<small>/' + total + '</small>';
  $('sumNot').textContent = total - read.length;
  $('sumTotal').textContent = fmtMinutes(sumMin);
  $('sumAvg').textContent = read.length ? fmtMinutes(Math.round(sumMin / read.length)) : '-';

  $('grid').innerHTML = students.map(s => {
    const m = minutesOn(s, viewDate);
    return '<button class="tile ' + level(m) + '" data-no="' + s.no + '">' +
      '<div class="no">' + s.no + '번</div>' +
      '<div class="nm">' + escapeHtml(s.name) + '</div>' +
      (m > 0 ? '<div class="mins">' + fmtMinutes(m) + '</div>' : '<div class="mins zero">기록 없음</div>') +
      '<div class="tot">누적 ' + fmtMinutes(s.totalMinutes) + '</div>' +
    '</button>';
  }).join('');
  $('grid').querySelectorAll('.tile').forEach(t => {
    t.addEventListener('click', () => openDetail(Number(t.dataset.no)));
  });

  const notRead = students.filter(s => minutesOn(s, viewDate) <= 0);
  $('notRead').innerHTML = notRead.length === 0
    ? '<div class="all-done">🎉 모든 학생이 읽었어요!</div>'
    : '<h3>아직 기록 없는 학생 (' + notRead.length + '명)</h3><div class="chips">' +
      notRead.map(s => '<span>' + s.no + ' ' + escapeHtml(s.name) + '</span>').join('') + '</div>';

  if (excludedCount > 0) {
    $('excludedNote').style.display = 'block';
    $('excludedNote').textContent = '※ 번호와 이름이 명단과 맞지 않는 기록 ' + excludedCount +
      '건은 집계에서 뺐어요. 구글 시트 메뉴 [📚 독서기록 관리 > 명단에 없는 기록 정리]로 "기록" 시트에서 치울 수 있어요.';
  } else {
    $('excludedNote').style.display = 'none';
  }
}

// ---------- 학생 상세 ----------
function openDetail(no) {
  const s = students.find(x => x.no === no);
  if (!s) return;
  const rows = (s.days || []).slice().reverse().map(d =>
    '<div class="day-row' + (d.date === viewDate ? ' sel' : '') + '"><span class="d">' + dateLabel(d.date) +
    '</span><span class="m">' + fmtMinutes(d.minutes) + '</span></div>'
  ).join('') || '<div class="empty">아직 기록이 없어요</div>';

  $('detail').innerHTML =
    '<div class="detail-head"><h2>' + s.no + '번 ' + escapeHtml(s.name) + '</h2>' +
    '<button class="close" id="btnClose" aria-label="닫기">×</button></div>' +
    '<div class="stats">' +
      '<div><b>' + fmtMinutes(minutesOn(s, viewDate)) + '</b><span>' + dateLabel(viewDate).replace(' · 오늘', '') + '</span></div>' +
      '<div><b>' + fmtMinutes(s.totalMinutes) + '</b><span>전체 누적</span></div>' +
      '<div><b>' + (s.days || []).length + '일</b><span>읽은 날 수</span></div>' +
    '</div>' + rows;
  $('overlay').classList.add('show');
  $('btnClose').addEventListener('click', closeDetail);
}
function closeDetail() { $('overlay').classList.remove('show'); }
$('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') closeDetail(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });
</script>
</body>
</html>
